=\"#0ea5e9\"/><circle cx=\"12\" cy=\"17\" r=\"3\" fill=\"#fff\"/><circle cx=\"20\" cy=\"17\" r=\"3\" fill=\"#fff\"/><circle cx=\"12\" cy=\"17\" r=\"1.3\" fill=\"#1e1b4b\"/><circle cx=\"20\" cy=\"17\" r=\"1.3\" fill=\"#1e1b4b\"/><path d=\"M16 9V5\" stroke=\"#0ea5e9\" stroke-width=\"2\"/><circle cx=\"16\" cy=\"4\" r=\"2\" fill=\"#ffc83d\"/>", "doc": "<path d=\"M7 3h13l6 6v20H7z\" fill=\"#fff\" stroke=\"#8f7bff\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M11 15h12M11 19h12M11 24h7\" stroke=\"#5b3df5\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M20 3v6h6z\" fill=\"#ffc83d\"/>", "check": "<circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#14b890\"/><path d=\"M9.5 16.5l4.500 4.500 8.500-9\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "bars": "<rect x=\"4\" y=\"16\" width=\"6\" height=\"12\" rx=\"2\" fill=\"#ffc83d\"/><rect x=\"13\" y=\"8\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#ff6b57\"/><rect x=\"22\" y=\"3\" width=\"6\" height=\"25\" rx=\"2\" fill=\"#5b3df5\"/>", "books": "<rect x=\"3\" y=\"6\" width=\"7\" height=\"22\" rx=\"2\" fill=\"#5b3df5\"/><rect x=\"11\" y=\"4\" width=\"7\" height=\"24\" rx=\"2\" fill=\"#14b890\"/><path d=\"M20 9l6-2 4 19-6 2z\" fill=\"#ff6b57\"/>", "clip": "<path d=\"M22 10L12 20a3 3 0 004 4l10-11a6 6 0 00-9-8L7 16a9 9 0 0013 13\" stroke=\"#ff6b57\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>", "gem": "<path d=\"M8 5h16l6 8-14 16L2 13z\" fill=\"#0ea5e9\"/><path d=\"M2 13h28M12 5l-3 8 7 16 7-16-3-8\" stroke=\"#fff\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"/>", "scale": "<path d=\"M16 5v20M9 27h14M5 9h22\" stroke=\"#5b3df5\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M2 17l3-8 3 8a3 3 0 01-6 0zM24 17l3-8 3 8a3 3 0 01-6 0z\" fill=\"#ffc83d\"/>", "magnet": "<path d=\"M5 4h7v13a4 4 0 008 0V4h7v13a11 11 0 01-22 0z\" fill=\"#ff6b57\"/><rect x=\"5\" y=\"4\" width=\"7\" height=\"6\" fill=\"#e5e7ff\"/><rect x=\"20\" y=\"4\" width=\"7\" height=\"6\" fill=\"#e5e7ff\"/>", "puzzle": "<path d=\"M5 8h8a3 3 0 116 0h8v8a3 3 0 100 6v7H5z\" fill=\"#14b890\"/><path d=\"M13 15l-3 3 3 3M19 15l3 3-3 3\" stroke=\"#fff\" stroke-width=\"2.200\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "mic": "<rect x=\"11\" y=\"3\" width=\"10\" height=\"17\" rx=\"5\" fill=\"#d946ef\"/><path d=\"M6 15a10 10 0 0020 0M16 25v4M11 29h10\" stroke=\"#a21caf\" stroke-width=\"2.400\" fill=\"none\" stroke-linecap=\"round\"/>", "camera": "<path d=\"M4 10h5l2-3h10l2 3h5v17H4z\" fill=\"#0ea5e9\"/><circle cx=\"16\" cy=\"18\" r=\"6\" fill=\"#fff\"/><circle cx=\"16\" cy=\"18\" r=\"3.500\" fill=\"#5b3df5\"/>", "bulb": "<path d=\"M16 3a9 9 0 00-5 16.500V22h10v-2.500A9 9 0 0016 3z\" fill=\"#ffc83d\"/><rect x=\"11\" y=\"23\" width=\"10\" height=\"3\" rx=\"1.500\" fill=\"#64748b\"/><rect x=\"13\" y=\"27\" width=\"6\" height=\"2.500\" rx=\"1.200\" fill=\"#64748b\"/>", "sun": "<circle cx=\"16\" cy=\"16\" r=\"6\" fill=\"#ffc83d\"/><path d=\"M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3\" stroke=\"#ff9f1c\" stroke-width=\"2.600\" stroke-linecap=\"round\"/>", "moon": "<path d=\"M25 20A11 11 0 0112 7a11 11 0 1013 13z\" fill=\"#8f7bff\"/><circle cx=\"21\" cy=\"7\" r=\"1.500\" fill=\"#ffc83d\"/><circle cx=\"26\" cy=\"12\" r=\"1\" fill=\"#ffc83d\"/>"};
const ic = k => `<svg class="ic" viewBox="0 0 32 32" aria-hidden="true">${ICONS[k] || ""}</svg>`;
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  vol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>',
  l: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  store: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3.5v17a1 1 0 001.5.9l14-8.5a1 1 0 000-1.8l-14-8.5A1 1 0 004 3.5z"/></svg>',
  full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/></svg>',
  exitFull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 01-2 2H4M15 3v3a2 2 0 002 2h3M21 15h-3a2 2 0 00-2 2v3M3 15h3a2 2 0 012 2v3"/></svg>'
};
const player = (src, label) => `<div class="vp paused"><video muted loop playsinline preload="metadata" src="${src}" aria-label="${label} teaser"></video>
<button class="ov" aria-label="Play or pause ${label}"><span>${ICON.play}</span></button><div class="bar"><i></i></div>
<button class="full" aria-label="Full screen ${label}">${ICON.full}</button>
<button class="mute" aria-label="Toggle sound">${ICON.off}</button></div>`;

/* profile */
document.title = `${PROFILE.name} · ${PROFILE.role}`;
$("#name").innerHTML = `${PROFILE.name}<span>${PROFILE.role}</span>`;
$("#bio").textContent = PROFILE.bio;
$("#photo").src = PROFILE.photo;
$("#copy").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;
$("#mail").href = PROFILE.email ? "mailto:" + PROFILE.email : "#apps";
if (!PROFILE.email) { $("#mail").textContent = "Explore the apps"; }

/* metrics */
$("#metrics").innerHTML = METRICS.map(m => `<div class="metric rv"><i style="background:${m.color}22">${ic(m.icon)}</i><div><b data-to="${m.value}" data-suf="${m.suffix}">0</b><small>${m.label}</small></div></div>`).join("");

/* apps */
$("#appList").innerHTML = APPS.map(a => `
<article class="app rv" style="--tint:${a.tint}" id="${a.id}">
  <div class="app-top">
    <div>
      <div class="app-id"><img src="${a.icon}" alt="${a.name} icon"><div><h3>${a.name}</h3><span class="badge">Live on Play Store</span></div></div>
      <p class="d">${a.desc}</p>
      <div class="feats">${a.features.map(f => { const [k, t] = f.split("|"); return `<span>${ic(k)}${t}</span>`; }).join("")}</div>
      <a class="btn fill" style="background:${a.tint};border-color:${a.tint}" href="${a.store}" target="_blank" rel="noopener">${ICON.store} Get it on Google Play</a>
    </div>
    ${player(a.video, a.name)}
  </div>
  <div class="shots-h"><h4>Inside the app</h4><div class="nav"><button aria-label="Previous screenshots" data-d="-1">${ICON.l}</button><button aria-label="Next screenshots" data-d="1">${ICON.r}</button></div></div>
  <div class="track" data-app="${a.id}">${Array.from({ length: a.count }, (_, i) => `<button aria-label="Open screenshot ${i + 1}" data-i="${i}"><img loading="lazy" src="${a.shots}${i + 1}.jpg" alt="${a.name} screenshot ${i + 1}"></button>`).join("")}</div>
</article>`).join("");

/* tools */
$("#toolList").innerHTML = TOOLS.map(t => `<article class="tool rv" style="--tint:${t.tint}">${player(t.video, t.name)}<h3>${ic(t.icon)}${t.name}</h3><p>${t.desc}</p><span class="tag">${t.tag}</span></article>`).join("");

/* carousel */
document.querySelectorAll(".app").forEach(app => {
  const tr = $(".track", app);
  app.querySelectorAll(".nav button").forEach(b => b.onclick = () => {
    const w = tr.firstElementChild.getBoundingClientRect().width + 16;
    const step = Math.max(1, Math.round(tr.clientWidth / w));
    tr.scrollBy({ left: b.dataset.d * w * step, behavior: "smooth" });
  });
});

/* lightbox */
const lb = $("#lb"), lbImg = $("img", lb); let cur = { app: null, i: 0 };
const showLb = () => { const a = APPS.find(x => x.id === cur.app); lbImg.src = a.shots + (cur.i + 1) + ".jpg"; lbImg.alt = `${a.name} screenshot ${cur.i + 1}`; };
const stepLb = d => { const a = APPS.find(x => x.id === cur.app); cur.i = (cur.i + d + a.count) % a.count; showLb(); };
document.addEventListener("click", e => {
  const s = e.target.closest(".track button");
  if (s) { cur = { app: s.parentElement.dataset.app, i: +s.dataset.i }; showLb(); lb.classList.add("on"); return; }
  if (e.target === lb || e.target.closest(".x")) lb.classList.remove("on");
  if (e.target.closest(".lb .p")) stepLb(-1);
  if (e.target.closest(".lb .n")) stepLb(1);
});
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") lb.classList.remove("on");
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});
let tx = 0;
lb.addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
lb.addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) stepLb(d < 0 ? 1 : -1); });

/* video players: one at a time, autoplay when in view */
const vps = [...document.querySelectorAll(".vp")];
let active = null;
const setUI = (vp, playing) => { vp.classList.toggle("paused", !playing); $(".ov span", vp).innerHTML = playing ? ICON.pause : ICON.play; };
const playVp = vp => { if (active && active !== vp) pauseVp(active); const v = $("video", vp); v.play().then(() => { active = vp; setUI(vp, true); }).catch(() => {}); };
const pauseVp = vp => { $("video", vp).pause(); setUI(vp, false); if (active === vp) active = null; };
vps.forEach(vp => {
  const v = $("video", vp);
  $(".ov", vp).onclick = () => { vp.userPaused = !v.paused; v.paused ? playVp(vp) : pauseVp(vp); };
  $(".mute", vp).onclick = e => { v.muted = !v.muted; e.currentTarget.innerHTML = v.muted ? ICON.off : ICON.vol; };
  $(".full", vp).onclick = e => {
    e.stopPropagation();
    const isFs = document.fullscreenElement === vp || document.webkitFullscreenElement === vp;
    if (isFs) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    } else if (vp.requestFullscreen) {
      vp.requestFullscreen();
    } else if (vp.webkitRequestFullscreen) {
      vp.webkitRequestFullscreen();
    } else if (v.webkitEnterFullscreen) {
      v.webkitEnterFullscreen(); // iOS Safari video fullscreen fallback
    }
  };
  document.addEventListener("fullscreenchange", () => {
    const btn = $(".full", vp);
    if (!btn) return;
    const isFs = document.fullscreenElement === vp;
    btn.innerHTML = isFs ? ICON.exitFull : ICON.full;
  });
  v.addEventListener("timeupdate", () => { $(".bar i", vp).style.width = (v.currentTime / v.duration * 100 || 0) + "%"; });
});
const ratios = new Map();
const vio = new IntersectionObserver(es => {
  es.forEach(e => ratios.set(e.target, e.isIntersecting ? e.intersectionRatio : 0));
  const best = [...ratios].filter(([, r]) => r > .6).sort((a, b) => b[1] - a[1])[0];
  if (active && (ratios.get(active) || 0) < .6) { pauseVp(active); }
  if (best && !best[0].userPaused && active !== best[0]) playVp(best[0]);
  ratios.forEach((r, vp) => { if (r < .6) vp.userPaused = false; });
}, { threshold: [0, .3, .6, .8, 1] });
vps.forEach(vp => vio.observe(vp));
document.addEventListener("visibilitychange", () => { if (document.hidden && active) pauseVp(active); });

/* reveal + counters */
const rio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in"); rio.unobserve(e.target);
  const n = $("b[data-to]", e.target);
  if (n) { const to = +n.dataset.to, t0 = performance.now(); (function f(t) { const p = Math.min((t - t0) / 1200, 1); n.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + n.dataset.suf; if (p < 1) requestAnimationFrame(f); })(t0); }
}), { threshold: .2 });
document.querySelectorAll(".rv").forEach(el => rio.observe(el));
document.querySelectorAll("[data-ic]").forEach(n => n.innerHTML = ic(n.dataset.ic));
/* theme */
const tbtn = $("#theme"), root = document.documentElement;
const setTheme = t => { root.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} tbtn.innerHTML = ic(t === "dark" ? "sun" : "moon"); tbtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode"); };
tbtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
tbtn.innerHTML = ic(root.dataset.theme === "dark" ? "sun" : "moon");
tbtn.setAttribute("aria-label", root.dataset.theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
</script>
</body>
</html>
