<!DOCTYPE html>
<!--
  ============================================================================
  Stayly - Airbnb listing page clone (take-home assignment, PlayPower Labs)
  ============================================================================
  A single-file, zero-build React 18 app.
  - React + ReactDOM are loaded from cdnjs (UMD builds) so the page runs on any
    device by simply opening index.html - no npm, bundler or server needed.
  - Uses React.createElement (aliased to `h`) instead of JSX, since there is no
    Babel/build step.
  - All state lives in React state; only two small preferences (saved heart and
    selected dates) are persisted to localStorage.
  - Images come from Unsplash / pravatar; icons from Font Awesome (cdnjs).

  File layout (top to bottom):
    1. <style>   Design tokens + component styles, grouped per page section
    2. <script>  Helpers -> icons -> data -> components -> <App> -> render

  NOTE: comments only were added in the documented version; behaviour and
  markup are unchanged from the original clone.
  ============================================================================
-->
<html lang="en"><head><meta charset="utf-8"><title>Sea-view serviced apartment · Candolim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ---------- Design tokens & global reset ----------
   --pc : brand (primary) colour, --g : grey text, --l : light divider */
:root{--pc:#ff7f6b;--g:#717171;--l:#ebebeb}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;line-height:1.5;color:#000;background:#fff}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid #000;outline-offset:2px}
/* .w : centred page container */
.w{max-width:1120px;margin:0 auto;padding:0 40px}
/* ---------- Top header (logo, search pill, right-hand menu) ---------- */
.hd{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--l)}
.logo{color:var(--pc);font-size:29px;font-weight:700;display:flex;align-items:center;gap:6px;text-decoration:none}
.pill{display:flex;align-items:center;border:1px solid #ddd;border-radius:40px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:8px 8px 8px 20px;font-size:16px;font-weight:600;gap:0;cursor:pointer;transition:box-shadow .2s}
.pill:hover{box-shadow:0 4px 14px rgba(0,0,0,.28)}
.pill span{padding:0 16px;border-right:1px solid var(--l)}.pill span:nth-child(3){border:0;color:var(--g);font-weight:400}
.pill span:first-child{display:flex;gap:8px;align-items:center;padding-left:0}
.sb{width:32px;height:32px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:15px}
.rt{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.rt a{padding:10px 14px;color:#000;text-decoration:none;border-radius:24px;transition:background .2s}
.rt a:hover{background:#f2f2f2}
.ci{width:38px;height:38px;border-radius:50%;background:#f2f2f2;display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.ci:hover{background:#dedede;color:#444}
/* ---------- Sticky section-tab bar (replaces header after scrolling past photos) ---------- */
.stk{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:1px solid var(--l);height:80px;animation:dn .25s}
@keyframes dn{from{transform:translateY(-100%)}}
.stk .w{display:flex;height:100%;align-items:center;justify-content:space-between}
.tabs a{display:inline-block;padding:29px 0;margin-right:24px;font-size:16px;font-weight:600;color:#000;text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{border-color:#000}
.sm{display:flex;align-items:center;gap:20px;font-size:16px}
.sm b{font-size:18px}
.rb{background:var(--pc);color:#fff;border-radius:40px;padding:12px 28px;font-weight:600}
/* ---------- Typography, title row & share/save links ---------- */
h1{font-size:29px;margin:24px 0 0;font-weight:600}h2{font-size:25px;font-weight:600;margin:0 0 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0 16px}.top h1{margin:0}
.ul{text-decoration:underline;font-weight:600;font-size:16px;padding:8px 10px;border-radius:8px}.ul:hover{background:#f2f2f2}
.ul i{margin-right:6px}
/* ---------- Hero photo collage (1 large + 4 small) ---------- */
.col{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:600px;border-radius:14px;overflow:hidden;position:relative}
.col .m{height:100%}.col .q{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:8px}
/* .ph : reusable photo tile with hover zoom */
.ph{overflow:hidden;position:relative;background:#eee;cursor:pointer;width:100%;height:100%;display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.ph:hover img{transform:scale(1.05)}
.sa{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid #222;border-radius:8px;padding:7px 14px;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
/* ---------- Generic section wrapper & rating strip ---------- */
.sec{padding:32px 0;border-bottom:1px solid var(--l)}
.gr{color:var(--g)}.sub{font-size:18px}
.rv{display:flex;align-items:center;border:1px solid #ddd;border-radius:12px;height:92px;margin:24px 0;max-width:100%}
.rv>div{flex:1;text-align:center}.rv .fv{font-weight:700;font-size:18px;border-right:1px solid #ddd;height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
.rv .fv i{color:var(--pc)}.rv b{font-size:25px}
/* ---------- Host summary, highlight features, description ---------- */
.av{width:48px;height:48px;border-radius:50%;object-fit:cover}
.hs{display:flex;gap:16px;align-items:center}
.ft{display:flex;gap:16px;margin-bottom:24px}.ft i{width:28px;font-size:27px;text-align:center;margin-top:4px}
.ft b{font-weight:600;display:block}
/* .desc : collapsible text block (max-height is animated from React) */
.desc{white-space:pre-line;overflow:hidden;transition:max-height .35s;position:relative}
.desc .fade{position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 85%);pointer-events:none}
.xlate{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#f7f7f7;border-radius:12px;padding:18px 22px;margin-bottom:20px;font-size:16px}
.xlink{font-weight:600;text-decoration:underline;white-space:nowrap;flex-shrink:0}
.noHover:hover{background:none}
/* ---------- "Where you'll sleep" cards ---------- */
.sl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sl .ph{height:300px;border-radius:12px;cursor:default}.sl .ph:hover img{transform:none}
/* ---------- Amenities preview grid + outline button ---------- */
.am{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);gap:16px 40px}
.ai{display:flex;gap:16px;align-items:center;font-size:18px}.ai i{width:26px;text-align:center;font-size:25px}
.ai.no{text-decoration:line-through;color:#b0b0b0}
.bo{border:1px solid #000;border-radius:8px;padding:13px 23px;font-weight:600;margin-top:32px}.bo:hover{background:#f7f7f7}
/* ---------- Generic modal (used by the "all amenities" dialog) ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.md{background:#fff;border-radius:16px;width:min(780px,92vw);max-height:80vh;overflow:auto;padding:0 32px 32px;animation:up .25s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.md h3{font-size:18px;font-weight:600;margin:32px 0 16px;padding-top:24px;border-top:1px solid var(--l)}.md h3:first-of-type{border:0}
.mh{position:sticky;top:0;background:#fff;padding:20px 0;margin:0 -8px}.mh button{width:32px;height:32px;border-radius:50%}.mh button:hover{background:#f2f2f2}
.md .ai{margin-bottom:16px}
/* ---------- Two-month date-range calendar ---------- */
.cal{display:flex;gap:56px;position:relative;user-select:none}.cm{flex:1}
.nv{position:absolute;top:0;width:32px;height:32px;border-radius:50%}.nv:hover{background:#f2f2f2}
.cm h4{text-align:center;margin:0 0 20px;font-size:18px;font-weight:600}
.gd{display:grid;grid-template-columns:repeat(7,1fr)}
.wd{text-align:center;font-size:14px;color:var(--g);padding-bottom:8px}
.dy{height:48px;display:grid;place-items:center;font-size:16px;font-weight:500;cursor:pointer}
.dy span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.dy:hover span{border:1px solid #000}
/* day states: .p past, .in inside range, .st start, .en end, .rg has a range */
.dy.p{color:#c8c8c8;text-decoration:line-through;cursor:default}.dy.p:hover span{border:0}
.dy.in{background:#f0f0f0}.dy.in:hover span{border:0}
.dy.st span,.dy.en span{background:#000;color:#fff}
.dy.st.rg{background:linear-gradient(90deg,#fff 50%,#f0f0f0 50%)}.dy.en.rg{background:linear-gradient(90deg,#f0f0f0 50%,#fff 50%)}
/* ---------- Full-screen photo tour (gallery) & lightbox ---------- */
.gal{position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;animation:fi .25s}
.gh{position:sticky;top:0;background:#fff;z-index:2;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.ib{width:40px;height:40px;border-radius:50%}.ib:hover{background:#f2f2f2}
.gb{max-width:1200px;margin:0 auto;padding:16px 40px 80px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tg .ph{aspect-ratio:1/1;border-radius:10px}.cap{font-size:16px;font-weight:600;margin:8px 0 0}
.gsp{margin-top:56px}.gsp .ph{border-radius:12px;aspect-ratio:16/9}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.g4 .ph{aspect-ratio:4/3}
.lb{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;animation:fi .2s;color:#fff}
.lb .gh{background:#000;color:#fff}.lb .ib:hover{background:#222}
.st2{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.st2 img{max-width:calc(100% - 200px);max-height:calc(100vh - 170px);border-radius:6px;animation:sr .35s}
.st2 img.r{animation-name:sl2}
/* slide-in animations: sr = next photo (from right), sl2 = previous photo (from left) */
@keyframes sr{from{opacity:0;transform:translateX(40px)}}@keyframes sl2{from{opacity:0;transform:translateX(-40px)}}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #666;background:#111}
.ar:hover{background:#333}.ar:disabled{opacity:.3;cursor:default}
.lc{text-align:center;padding:12px 0 24px;font-size:16px}
/* ---------- "Guest favourite" ratings block ---------- */
.gf{border-bottom:0}
.gftop{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 8px}
.gfnum{font-size:81px;font-weight:600;line-height:1;text-align:center}
.gfh2{font-size:25px;font-weight:600;margin:14px 0 10px;text-align:center}
.gfd{color:var(--g);text-align:center;max-width:360px;margin:0 auto;font-size:17px}
.gflink{display:block;text-align:center;margin-top:16px;font-size:17px}
.gfrow{display:flex;margin-top:64px}
.gfcol{flex:1;text-align:center;position:relative;padding:0 12px}
.gfcol:not(:last-child)::after{content:'';position:absolute;right:0;top:2px;bottom:2px;width:1px;background:var(--l)}
.gfcol h5{font-size:17px;font-weight:600;margin:0 0 16px}
.gfcol .val{font-size:17px;margin-bottom:14px}
.gfcol>i{font-size:25px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g);margin-bottom:6px}
.bar-row span{width:8px}
.bar-track{flex:1;height:4px;background:var(--l);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:#000;border-radius:2px}
.gfpills{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:64px}
.gfpill{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:24px;padding:10px 18px 10px 14px;font-size:16px}
.gfpill b{font-weight:600}
@media (max-width:1000px){.gfrow{overflow-x:auto}.gfcol{min-width:110px}}
/* ---------- Review cards grid ---------- */
.rg{display:grid;grid-template-columns:1fr 1fr;column-gap:64px;row-gap:40px;margin-top:8px}
.rh{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.rav{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.rav.ini{display:grid;place-items:center;font-weight:700;font-size:20px}
.rname{font-weight:600;font-size:17px}
.rsub{color:var(--g);font-size:15px}
.rmeta{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:12px}
.stars{display:flex;gap:2px}
.stars i{font-size:10px}
.rtext{font-size:17px;line-height:1.5;margin:0}
.rmore{display:block;margin-top:4px;font-size:17px}
/* Respect users who prefer reduced motion: disable all animations/transitions */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Where you'll be (CSS-drawn placeholder map) ---------- */
.mp{position:relative;height:480px;border-radius:14px;overflow:hidden;margin-top:24px;
 background:
  linear-gradient(115deg,transparent 46%,#fff 46%,#fff 48%,transparent 48%),
  linear-gradient(20deg,transparent 60%,#fff 60%,#fff 62%,transparent 62%),
  linear-gradient(180deg,transparent 30%,#fff 30%,#fff 31.5%,transparent 31.5%),
  linear-gradient(90deg,#e3edf3 0,#e3edf3 18%,#eaf0e2 18%,#eaf0e2 55%,#f1ede4 55%)}
.mp .pin{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,127,107,.25);display:grid;place-items:center}
.mp .pin i{width:32px;height:32px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:16px}
.mp .ms{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.mp .zm{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.mp .zm button{width:40px;height:40px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;font-size:16px}
.mp .zm button:hover{background:#f7f7f7}
.sh{font-size:18px;font-weight:600;margin:0 0 8px}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:underline;padding:12px 0 0;font-size:18px}
.more i{font-size:12px}


/* ---------- Meet your host ---------- */
.hw{display:grid;grid-template-columns:25% 1fr;gap:80px;align-items:start}
.hcard{display:grid;grid-template-columns:7fr 3fr;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:24px 0}
.hcl{text-align:center;padding:0 12px;border-right:1px solid var(--l)}
.hpic{position:relative;width:96px;height:96px;margin:0 auto 12px}
.hpic img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.hpic .vb{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--pc);color:#fff;border:2px solid #fff;display:grid;place-items:center;font-size:14px}
.hname{font-size:41px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.hrole{font-size:16px;color:var(--g);margin-top:4px}
.hcr{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 10px}
.hcr div+div{border-top:1px solid var(--l);padding-top:12px}
.hcr b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.hcr span{font-size:11px;font-weight:600}
.hinfo{margin-top:32px;display:flex;flex-direction:column;gap:16px;font-size:18px}
.hinfo div{display:flex;gap:16px;align-items:center}.hinfo i{width:24px;text-align:center;font-size:23px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 16px;margin:16px 0 40px}
.cg div{display:flex;align-items:center;gap:12px;font-size:17px}
.cg img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.hd2{font-size:18px;font-weight:600;margin:0 0 12px}
.hdl{font-size:17px;line-height:1.7}
.msg{margin-top:24px;background:#ebebeb;border-radius:8px;padding:14px 24px;font-weight:600}
.msg:hover{background:#e0e0e0}
.disc{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--g);margin-top:48px;text-align:center}
@media (max-width:900px){.hw{grid-template-columns:1fr;gap:40px}.mp{height:340px}}


/* ---------- Things to know ---------- */
.tk{display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.tk>div>i{font-size:32px;display:block;margin-bottom:16px}
.tk h3{font-size:18px;font-weight:600;margin:0 0 16px}
.tk p{margin:0 0 8px;font-size:18px}
.tk a{display:inline-block;margin-top:16px;font-size:18px;font-weight:700;color:#000;text-decoration:underline}
@media (max-width:800px){.tk{grid-template-columns:1fr}}


/* ---------- More stays nearby (scroll-snap carousel) ---------- */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.ch h2{margin:0}
.cc{display:flex;align-items:center;gap:12px;font-size:16px}
.cc .ib{border:1px solid #ddd;width:32px;height:32px}.cc .ib:disabled{opacity:.3;cursor:default}
.ct{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ct::-webkit-scrollbar{display:none}
.ci2{flex:0 0 calc((100% - 64px)/5);scroll-snap-align:start;min-width:0}
.ci2 img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;background:#eee}
.ci2 .nm{font-size:17px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci2 .pr{font-size:16px;display:flex;gap:8px;align-items:center;margin-top:2px}
.ci2 .pr i{font-size:12px}
@media (max-width:800px){.ci2{flex-basis:calc((100% - 32px)/3)}}
/* Leave room for the fixed 80px sticky nav when jumping to a section anchor */
#photos,
#amenities,
#reviews,
#location {
  scroll-margin-top: 96px;
}
/* ---------- "You won't be charged yet" toast shown after clicking Reserve ---------- */
.reserve-toast{
  position:fixed;
  left:50%;
  bottom:32px;
  transform:translateX(-50%) translateY(20px);
  background:#000;
  color:#fff;
  padding:18px 20px;
  border-radius:10px;
  font-size:16px;
  font-weight: bold;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.reserve-toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style></head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" nonce="NDEzNTYwMzU2MiwyMzcxNzQyMDQ4"></script>

<script nonce="NDEzNTYwMzU2MiwyMzcxNzQyMDQ4">
/* =========================================================================
   1. HELPERS
   h  = React.createElement (JSX-free authoring)
   S  = useState, E = useEffect, R = useRef
   ld / sv = safe localStorage read / write (silently ignore storage errors)
   I  = Font Awesome icon: I('solid star') -> <i class="fa-solid fa-star">
   SVG = base wrapper for the hand-drawn inline SVG icons below
   ========================================================================= */
const h=React.createElement,{useState:S,useEffect:E,useRef:R}=React;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const I=(c,p)=>h('i',{className:c.split(' ').map(w=>'fa-'+w).join(' '),'aria-hidden':true,...p});
const SVG=(children,p)=>h('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':true,style:{flexShrink:0},...p},children);

/* =========================================================================
   2. INLINE SVG ICON COMPONENTS
   Small stroke icons drawn by hand so no extra icon font is needed.
   ========================================================================= */
const ChevronIcon=({dir='left',...p})=>SVG(h('path',{d:dir==='left'?'M15 6l-6 6 6 6':'M9 6l6 6-6 6'}),{width:18,height:18,strokeWidth:2,...p});
const XIcon=p=>SVG([h('path',{key:1,d:'M6 6l12 12'}),h('path',{key:2,d:'M18 6L6 18'})],{width:18,height:18,strokeWidth:2,...p});
const PlusIcon=p=>SVG([h('path',{key:1,d:'M12 5v14'}),h('path',{key:2,d:'M5 12h14'})],{width:16,height:16,strokeWidth:2,...p});
const MinusIcon=p=>SVG(h('path',{d:'M5 12h14'}),{width:16,height:16,strokeWidth:2,...p});
